<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mb-phone" x1="90" y1="30" x2="180" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6B82"/><stop offset="1" stop-color="#C40020"/></linearGradient>
    <linearGradient id="mb-coin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFD978"/><stop offset="1" stop-color="#F2A93B"/></linearGradient>
  </defs>
  <ellipse cx="130" cy="182" rx="90" ry="14" fill="#000" opacity="0.08"/>
  <!-- phone -->
  <rect x="92" y="30" width="78" height="146" rx="20" fill="url(#mb-phone)"/>
  <rect x="100" y="40" width="62" height="126" rx="12" fill="#fff" opacity="0.16"/>
  <rect x="118" y="36" width="26" height="5" rx="2.5" fill="#fff" opacity="0.4"/>
  <!-- screen content: % and bar -->
  <text x="131" y="98" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="800">%</text>
  <rect x="110" y="116" width="42" height="8" rx="4" fill="#fff" opacity="0.55"/>
  <rect x="110" y="130" width="28" height="8" rx="4" fill="#fff" opacity="0.35"/>
  <!-- floating coin -->
  <g transform="translate(178 64)">
    <ellipse cx="0" cy="2" rx="22" ry="22" fill="url(#mb-coin)"/>
    <ellipse cx="0" cy="-1" rx="22" ry="22" fill="#FFE6A6"/>
    <text x="0" y="6" text-anchor="middle" fill="#E0982C" font-family="Arial, sans-serif" font-size="18" font-weight="800">$</text>
  </g>
</svg>
