<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mg-house" x1="70" y1="60" x2="190" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#34D8C8"/><stop offset="1" stop-color="#0E9488"/></linearGradient>
    <linearGradient id="mg-roof" x1="60" y1="40" x2="200" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6B82"/><stop offset="1" stop-color="#C40020"/></linearGradient>
    <linearGradient id="mg-key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFD978"/><stop offset="1" stop-color="#F2A93B"/></linearGradient>
  </defs>
  <ellipse cx="130" cy="180" rx="92" ry="14" fill="#000" opacity="0.08"/>
  <!-- house body -->
  <rect x="78" y="98" width="104" height="72" rx="10" fill="url(#mg-house)"/>
  <rect x="78" y="98" width="104" height="18" rx="9" fill="#fff" opacity="0.16"/>
  <!-- roof -->
  <path d="M66 100 L130 54 L194 100 z" fill="url(#mg-roof)"/>
  <path d="M130 54 L194 100 H166 L130 72 z" fill="#000" opacity="0.08"/>
  <!-- door + window -->
  <rect x="118" y="128" width="24" height="42" rx="5" fill="#0B6F66"/>
  <rect x="92" y="126" width="18" height="18" rx="4" fill="#fff" opacity="0.5"/>
  <rect x="150" y="126" width="18" height="18" rx="4" fill="#fff" opacity="0.5"/>
  <!-- key -->
  <g transform="translate(186 132)">
    <circle cx="0" cy="0" r="13" fill="none" stroke="url(#mg-key)" stroke-width="7"/>
    <rect x="10" y="-3.5" width="30" height="7" rx="3.5" fill="url(#mg-key)"/>
    <rect x="30" y="3.5" width="7" height="9" rx="2" fill="url(#mg-key)"/>
  </g>
</svg>
