<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cd-card" x1="40" y1="60" x2="210" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B2F3A"/><stop offset="1" stop-color="#0E1016"/>
    </linearGradient>
    <linearGradient id="cd-card2" x1="70" y1="40" x2="230" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5C72"/><stop offset="1" stop-color="#C40020"/>
    </linearGradient>
    <linearGradient id="cd-chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE08A"/><stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
  </defs>
  <ellipse cx="130" cy="180" rx="96" ry="15" fill="#000" opacity="0.10"/>
  <!-- back card (brand) -->
  <g transform="rotate(-9 150 95)">
    <rect x="92" y="46" width="150" height="96" rx="16" fill="url(#cd-card2)"/>
    <rect x="92" y="46" width="150" height="30" rx="16" fill="#fff" opacity="0.12"/>
    <text x="167" y="128" text-anchor="middle" fill="#fff" opacity="0.85" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DCB</text>
  </g>
  <!-- front card (graphite) -->
  <g transform="rotate(7 110 120)">
    <rect x="34" y="78" width="150" height="96" rx="16" fill="url(#cd-card)"/>
    <rect x="34" y="78" width="150" height="30" rx="16" fill="#fff" opacity="0.06"/>
    <rect x="50" y="104" width="22" height="17" rx="4" fill="url(#cd-chip)"/>
    <path d="M78 104a10 10 0 0 1 0 17M84 100a16 16 0 0 1 0 25" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="50" y="150" fill="#fff" opacity="0.65" font-family="monospace" font-size="11" letter-spacing="2">•••• 4892</text>
    <text x="150" y="98" text-anchor="end" fill="#FF6B82" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">ELCART</text>
  </g>
