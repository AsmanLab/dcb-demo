<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tr-phone" x1="80" y1="40" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D8C8"/><stop offset="1" stop-color="#0E9488"/>
    </linearGradient>
    <linearGradient id="tr-coin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFD978"/><stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
  </defs>
  <ellipse cx="130" cy="182" rx="92" ry="14" fill="#000" opacity="0.08"/>
  <!-- phone -->
  <rect x="92" y="34" width="76" height="138" rx="20" fill="url(#tr-phone)"/>
  <rect x="100" y="44" width="60" height="118" rx="12" fill="#fff" opacity="0.16"/>
  <rect x="118" y="40" width="24" height="5" rx="2.5" fill="#fff" opacity="0.4"/>
  <!-- transfer arrows -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M114 96 h32 l-9 -9"/>
    <path d="M146 118 h-32 l9 9"/>
  </g>
  <!-- floating coin -->
  <g transform="translate(176 60)">
    <ellipse cx="0" cy="2" rx="22" ry="22" fill="url(#tr-coin)"/>
    <ellipse cx="0" cy="-1" rx="22" ry="22" fill="#FFE6A6"/>
    <text x="0" y="6" text-anchor="middle" fill="#E0982C" font-family="Arial, sans-serif" font-size="20" font-weight="800">¥</text>
  </g>
  <circle cx="62" cy="120" r="10" fill="#34D8C8" opacity="0.5"/>
</svg>
